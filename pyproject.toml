[project]
name = "diarize-transcribe"
version = "0.2.0"
description = "Local speaker diarization and speech transcription for audio files"
readme = "README.md"
license = "MIT"
authors = [{ name = "graelo", email = "graelo@graelo.cc" }]
requires-python = ">=3.14"
dependencies = [
  "typer>=0.27.2",
  "mlx-audio==0.5.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
diarize-transcribe = "diarize_transcribe.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/diarize_transcribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires downloading and loading MLX model weights"]
